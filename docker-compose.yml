version: '3.8'

services:
  # API Service (REST API)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ai-twin-api
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aitwin
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=admin-token
      - INFLUXDB_ORG=ai-twin
      - INFLUXDB_BUCKET=sensor_data
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai:8000
      - SECRET_KEY=your-secret-key-change-in-production
    volumes:
      - ./api/uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - influxdb
    networks:
      - ai-twin-network
    restart: unless-stopped

  # AI Backend Service (GPU-enabled)
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai-twin-ai
    ports:
      - "8000:8000"
    environment:
      - API_SERVICE_URL=http://api:8001
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - MODEL_PATH=/models
    volumes:
      - ./ai/models:/models
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      - redis
      - ollama
    networks:
      - ai-twin-network
    restart: unless-stopped

  # WebSocket Service
  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    container_name: ai-twin-websocket
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-secret-key-change-in-production
    depends_on:
      - redis
    networks:
      - ai-twin-network
    restart: unless-stopped

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-twin-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_WS_URL=ws://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
      - websocket
    networks:
      - ai-twin-network
    restart: unless-stopped

  # PostgreSQL (Metadata DB)
  postgres:
    image: postgres:15-alpine
    container_name: ai-twin-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aitwin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ai-twin-network
    restart: unless-stopped

  # Redis (Cache & Message Queue)
  redis:
    image: redis:7-alpine
    container_name: ai-twin-redis
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - ai-twin-network
    restart: unless-stopped

  # InfluxDB (Time-series DB)
  influxdb:
    image: influxdb:2.7
    container_name: ai-twin-influxdb
    environment:
      - INFLUXDB_DB=sensor_data
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=adminpassword
      - INFLUXDB_ADMIN_TOKEN=admin-token
      - INFLUXDB_ORG=ai-twin
    volumes:
      - influxdb-data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - ai-twin-network
    restart: unless-stopped

  # Ollama (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: ai-twin-ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - ai-twin-network
    restart: unless-stopped

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: ai-twin-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - ai
    networks:
      - ai-twin-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  influxdb-data:
  ollama-data:

networks:
  ai-twin-network:
    driver: bridge
